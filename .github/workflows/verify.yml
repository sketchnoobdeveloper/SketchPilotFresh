name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify manifest components exist in APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          DEXES=$(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$')
          for component in \
            snd/sketchpilot/app/MainActivity \
            snd/sketchpilot/app/SketchPilotApp \
            snd/sketchpilot/app/McpService; do
            found=false
            for dex in $DEXES; do
              if unzip -p "$APK" "$dex" | grep -a -q "$component"; then found=true; break; fi
            done
            if [ "$found" != true ]; then
              echo "FAIL: missing DEX class $component"
              exit 1
            fi
          done
          echo "PASS: all manifest components are present in the APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sketchpilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/**
          if-no-files-found: warn
